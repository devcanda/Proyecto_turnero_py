<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco - Solicitar Turno</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f1f4f9; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            user-select: none;
            position: relative; 
        }
        
        .header-top { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            right: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
        }
        
        .btn-regresar { 
            background-color: #e0e4e8; 
            color: black; 
            border: none; 
            padding: 15px 30px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            text-transform: uppercase; 
        }

        h2 { 
            color: #21437c; 
            margin-bottom: 25px; 
            font-size: 28px; 
            text-transform: uppercase; 
            text-align: center; 
            font-weight: bold; 
        }
        
        /* CONTENEDOR DEL TECLADO (Ancho estricto) */
        .step-wrapper { 
            width: 100%; 
            max-width: 450px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .display-box { 
            background: #25467a; 
            color: white; 
            font-size: 40px; 
            padding: 20px; 
            margin-bottom: 5px; 
            min-height: 50px; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            box-sizing: border-box;
        }
        
        .keypad { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 5px; 
            width: 100%; 
        }
        
        .key { 
            background-color: #25467a; 
            color: white; 
            border: none; 
            padding: 25px 20px; 
            font-size: 35px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        
        .key.action { background-color: #b3b9c5; color: white; }
        
        .btn-continuar { 
            background-color: #a3cc39; 
            color: white; 
            border: none; 
            padding: 20px; 
            width: 100%; 
            font-size: 30px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 5px; 
        }

        /* CONTENEDOR DE GRILLAS (Ancho expandido) */
        .step-wrapper-wide { 
            width: 100%; 
            max-width: 800px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        /* GRILLA PASO 2 (Dos columnas) */
        .grid-entidades { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            width: 100%; 
        }
        
        /* GRILLA PASO 3 (Una sola columna apilada para Trámites) */
        .grid-tramites { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 15px; 
            width: 100%; 
            max-width: 650px; /* Un poco más estrecho para que los botones no sean tan exageradamente largos */
        }
        
        .btn-entidad { 
            background-color: #2b446a; 
            color: white; 
            border: none; 
            padding: 25px 20px; 
            font-size: 20px; 
            font-weight: bold; 
            border-radius: 5px; 
            cursor: pointer; 
            text-transform: uppercase; 
        }
        
        .btn-vip { grid-column: 1 / -1; width: 50%; margin: 0 auto; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header-top">
        <!-- Asegúrate de tener logo.png en tu repositorio -->
        <img src="logo.png" alt="Logo" style="max-height: 80px;">
        <button class="btn-regresar hidden" id="btn-back" onclick="retroceder()">Regresar</button>
    </div>

    <!-- PASO 1: TECLADO NUMÉRICO -->
    <div id="step-1" class="step-wrapper">
        <h2>Por favor digite su documento</h2>
        <div class="display-box" id="display"></div>
        <div class="keypad">
            <button class="key" onclick="press('1')">1</button>
            <button class="key" onclick="press('2')">2</button>
            <button class="key" onclick="press('3')">3</button>
            <button class="key" onclick="press('4')">4</button>
            <button class="key" onclick="press('5')">5</button>
            <button class="key" onclick="press('6')">6</button>
            <button class="key" onclick="press('7')">7</button>
            <button class="key" onclick="press('8')">8</button>
            <button class="key" onclick="press('9')">9</button>
            <button class="key action" onclick="clearDisplay()">✖</button>
            <button class="key" onclick="press('0')">0</button>
            <button class="key action" onclick="backspace()">⮜</button>
        </div>
        <button class="btn-continuar" onclick="irAEntidades()">Continuar</button>
    </div>

    <!-- PASO 2: SELECCIÓN DE ENTIDAD PRINCIPAL -->
    <div id="step-2" class="step-wrapper-wide hidden">
        <h2>Por favor seleccione su entidad de atención</h2>
        <div class="grid-entidades">
            <button class="btn-entidad" onclick="seleccionarEntidad('SOAT')">SOAT</button>
            <button class="btn-entidad" onclick="generarTurno('ARL', 'A')">ARL</button>
            <button class="btn-entidad" onclick="generarTurno('Medicina Prepagada', 'M')">Medicina Prepagada</button>
            <button class="btn-entidad" onclick="generarTurno('Planes Complementarios', 'P')">Planes Complementarios</button>
            <button class="btn-entidad" onclick="generarTurno('Pólizas de Salud', 'S')">Pólizas de Salud</button>
            <button class="btn-entidad" onclick="generarTurno('Pólizas Estudiantiles', 'E')">Pólizas Estudiantiles</button>
            <button class="btn-entidad" onclick="generarTurno('Empresariales', 'EM')">Empresariales</button>
            <button class="btn-entidad" onclick="generarTurno('Particulares', 'PA')">Particulares</button>
            <button class="btn-entidad btn-vip" onclick="generarTurno('VIP', 'V')">VIP</button>
        </div>
    </div>

    <!-- PASO 3: TRÁMITES PARA SOAT -->
    <div id="step-3" class="step-wrapper-wide hidden">
        <h2>Por favor seleccione el tramite</h2>
        <div class="grid-tramites">
            <button class="btn-entidad" onclick="generarTurno('Imágenes SOAT', 'IS')">IMÁGENES SOAT</button>
            <button class="btn-entidad" onclick="generarTurno('Laboratorio Clínico SOAT', 'LS')">LABORATORIO CLÍNICO SOAT</button>
            <button class="btn-entidad" onclick="generarTurno('Medicina del Dolor S1 SOAT', 'MS')">MEDICINA DEL DOLOR S1 SOAT</button>
            <button class="btn-entidad" onclick="generarTurno('Post Quirúrgico SOAT', 'PS')">POST QUIRÚRGICO SOAT</button>
            <button class="btn-entidad" onclick="generarTurno('Atención Priorizada S1 SOAT', 'AS')">ATENCIÓN PRIORIZADA S1 SOAT</button>
        </div>
    </div>

    <script>
        let documento = "";
        let pasoActual = 1;
        const displayEl = document.getElementById('display');
        const serverIP = window.location.hostname;

        function press(num) { if (documento.length < 15) { documento += num; displayEl.innerText = documento; } }
        function clearDisplay() { documento = ""; displayEl.innerText = ""; }
        function backspace() { documento = documento.slice(0, -1); displayEl.innerText = documento; }

        function mostrarPaso(paso) {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.add('hidden');
            
            document.getElementById(`step-${paso}`).classList.remove('hidden');
            
            const btnBack = document.getElementById('btn-back');
            if (paso === 1) { btnBack.classList.add('hidden'); } 
            else { btnBack.classList.remove('hidden'); }
            
            pasoActual = paso;
        }

        function irAEntidades() {
            if (documento.length < 4) { alert("Por favor ingrese un documento válido."); return; }
            mostrarPaso(2);
        }

        function seleccionarEntidad(entidad) {
            if (entidad === 'SOAT') { mostrarPaso(3); } 
            else { generarTurno(entidad, entidad.charAt(0)); }
        }

        function retroceder() {
            if (pasoActual === 3) { mostrarPaso(2); }
            else if (pasoActual === 2) { mostrarPaso(1); clearDisplay(); }
        }

        async function generarTurno(nombreServicio, nomenclatura) {
            try {
                const resPacientes = await fetch(`http://${serverIP}:8100/pacientes/`);
                const pacientes = await resPacientes.json();
                const paciente = pacientes.find(p => p.numero_identificacion === documento);

                if (!paciente) {
                    alert("Paciente no registrado. Por favor, diríjase a la recepción.");
                    mostrarPaso(1);
                    clearDisplay();
                    return;
                }

                const payload = {
                    paciente_id: paciente.id,
                    servicio: nombreServicio,
                    nomenclatura: nomenclatura,
                    numero_turno: Math.floor(Math.random() * 100) + 1
                };

                const resTurno = await fetch(`http://${serverIP}:8100/turnos/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (resTurno.ok) {
                    const data = await resTurno.json();
                    alert(`¡Turno generado!\n\nSu turno es: ${data.nomenclatura}${data.numero_turno}\nPor favor, tome asiento.`);
                    mostrarPaso(1);
                    clearDisplay();
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión con el servidor.");
            }
        }
    </script>
</body>
</html>
