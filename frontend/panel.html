<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Turnero</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #ecf0f1; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #2c3e50; margin: 0; }
        button.btn-refresh { background-color: #34495e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button.btn-refresh:hover { background-color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 15px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #2980b9; color: white; }
        tr:hover { background-color: #f1f2f6; }
        .btn-call { background-color: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-call:hover { background-color: #2ecc71; }
        .empty-state { text-align: center; padding: 30px; color: #7f8c8d; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Panel de Asesores</h1>
        <button class="btn-refresh" onclick="cargarTurnos()">🔄 Actualizar Lista</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Servicio</th>
                <th>Turno</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tabla-turnos">
            <!-- Los turnos se cargarán aquí -->
        </tbody>
    </table>

    <script>
        const serverIP = window.location.hostname;

        async function cargarTurnos() {
            try {
                const response = await fetch(`http://${serverIP}:8100/turnos/pendientes`);
                const turnos = await response.json();
                const tbody = document.getElementById('tabla-turnos');
                tbody.innerHTML = '';

                if (turnos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No hay pacientes en espera.</td></tr>';
                    return;
                }

                turnos.forEach(turno => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${turno.id}</td>
                        <td>${turno.servicio}</td>
                        <td><strong style="font-size: 18px; color: #e74c3c;">${turno.nomenclatura}${turno.numero_turno}</strong></td>
                        <td>${turno.estado}</td>
                        <td><button class="btn-call" onclick="llamarTurno(${turno.id})">📢 Llamar</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error cargando turnos:", error);
            }
        }

        async function llamarTurno(id) {
            try {
                await fetch(`http://${serverIP}:8100/turnos/${id}/llamar`, { method: 'PUT' });
                cargarTurnos(); // Recarga la tabla para quitar el turno que ya llamamos
            } catch (error) {
                console.error("Error al llamar turno:", error);
                alert("Error de conexión.");
            }
        }

        // Cargar datos automáticamente al abrir el panel
        cargarTurnos();
    </script>
</body>
</html>
