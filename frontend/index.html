<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla - Turnero Digital</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding: 50px; }
        .turno-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; min-width: 300px; margin-top: 20px; }
        h1 { color: #2c3e50; }
        .numero { font-size: 80px; font-weight: bold; color: #e74c3c; margin: 10px 0; }
        .servicio { font-size: 24px; color: #7f8c8d; }
        #estado { color: #27ae60; font-weight: bold; margin-top: 20px; }
        .desconectado { color: #c0392b !important; }
    </style>
</head>
<body>

    <h1>Sala de Espera</h1>
    <p id="estado">Conectando al servidor...</p>

    <div class="turno-card">
        <div class="servicio" id="lbl-servicio">Esperando llamados...</div>
        <div class="numero" id="lbl-numero">--</div>
    </div>

    <script>
        // Detecta automáticamente la IP del servidor donde está alojado
        const serverIP = window.location.hostname;
        
        // Abre el túnel WebSocket directo al backend en el puerto 8100
        const ws = new WebSocket(`ws://${serverIP}:8100/ws/pantalla`);

        const estadoEl = document.getElementById('estado');
        const numeroEl = document.getElementById('lbl-numero');
        const servicioEl = document.getElementById('lbl-servicio');

        ws.onopen = function() {
            estadoEl.innerText = "🟢 Conectado en tiempo real";
            estadoEl.classList.remove('desconectado');
        };

        // Aquí ocurre la magia: Escucha los mensajes que envía Python
        ws.onmessage = function(event) {
            const mensaje = JSON.parse(event.data);
            
            if (mensaje.accion === "NUEVO_TURNO") {
                // Actualiza la pantalla instantáneamente
                numeroEl.innerText = `${mensaje.datos.nomenclatura}${mensaje.datos.numero}`;
                servicioEl.innerText = `Servicio: ${mensaje.datos.servicio}`;
                
                // Efecto visual sencillo
                document.body.style.backgroundColor = '#e8f6f3';
                setTimeout(() => document.body.style.backgroundColor = '#f4f7f6', 500);
            }
        };

        ws.onclose = function() {
            estadoEl.innerText = "🔴 Desconectado del servidor. Intentando reconectar...";
            estadoEl.classList.add('desconectado');
        };
    </script>
</body>
</html>
