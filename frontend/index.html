<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Espera - Turnero</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b3470; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        
        /* CABECERA */
        .header { display: flex; justify-content: space-between; align-items: center; height: 12vh; background-color: #fff; padding: 0 30px; border-bottom: 5px solid #92d050; box-sizing: border-box; }
        .header img { max-height: 8vh; }
        .reloj-container { background: #0b3470; color: white; padding: 10px 40px; border-radius: 50px; display: flex; gap: 20px; align-items: center; border: 3px solid #92d050; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .hora { color: #92d050; font-size: 4vh; font-weight: 900; }
        .fecha { font-size: 3vh; font-weight: bold; text-transform: capitalize; }

        /* CUERPO CENTRAL */
        .main-content { display: flex; height: 80vh; width: 100%; }
        
        /* ZONA DE VIDEO */
        .video-section { width: 65%; background-color: #000; position: relative; }
        .youtube-iframe { width: 100%; height: 100%; pointer-events: none; }
        
        /* ZONA DE TURNOS */
        .turnos-section { width: 35%; background-color: #0b3470; padding: 15px 25px; box-sizing: border-box; display: flex; flex-direction: column; border-left: 2px solid #92d050; }
        
        /* ENCABEZADOS ESTILO "PILL" */
        .tabla-header { display: flex; justify-content: space-between; margin-bottom: 25px; }
        .header-pill { background-color: #92d050; color: white; width: 45%; text-align: center; font-size: 4vh; font-weight: 900; padding: 10px 0; border-radius: 15px; border: 3px solid #7cb342; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        
        .lista-turnos { flex: 1; display: flex; flex-direction: column; gap: 20px; overflow: hidden; }
        
        /* FILAS DE TURNOS CENTRADAS */
        .turno-item { display: flex; justify-content: space-between; font-size: 5vh; font-weight: bold; transition: all 0.5s ease; }
        .turno-item.nuevo .turno-col, .turno-item.nuevo .mod-col { animation: parpadeoNuevo 1.5s infinite alternate; color: #92d050; border-color: #fff; }
        
        .turno-col { width: 45%; text-align: center; color: white; border-bottom: 3px solid #92d050; padding-bottom: 8px; }
        .mod-col { width: 45%; text-align: center; color: white; border-bottom: 3px solid #92d050; padding-bottom: 8px; text-transform: uppercase; }

        /* PIE DE PÁGINA (MARQUESINA) */
        .footer { height: 8vh; background-color: #fff; color: #0b3470; display: flex; align-items: center; font-size: 3.5vh; font-weight: 900; overflow: hidden; white-space: nowrap; box-sizing: border-box; border-top: 5px solid #92d050; }
        .marquee { display: inline-block; padding-left: 100%; animation: scroll 25s linear infinite; }

        @keyframes scroll { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        @keyframes parpadeoNuevo { 0% { text-shadow: 0 0 10px #92d050; } 100% { text-shadow: 0 0 30px #92d050, 0 0 10px #fff; } }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Logo Empresa">
        <div class="reloj-container">
            <div class="hora" id="reloj-hora">00:00</div>
            <div class="fecha" id="reloj-fecha">Cargando...</div>
        </div>
    </div>

    <div class="main-content">
        <div class="video-section">
            <iframe class="youtube-iframe" 
                src="https://www.youtube.com/embed/qZcLuGXM6H4?autoplay=1&mute=1&controls=0&loop=1&playlist=qZcLuGXM6H4&modestbranding=1&showinfo=0" 
                frameborder="0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="turnos-section">
            <div class="tabla-header">
                <div class="header-pill">TURNO</div>
                <div class="header-pill">MÓD</div>
            </div>
            <div class="lista-turnos" id="contenedor-turnos">
                <!-- Inyección dinámica de turnos -->
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="marquee">
            ::: BIENVENIDO AL CANAL DIGITAL DE ATENCIÓN ::: POR FAVOR ESTÉ ATENTO A SU LLAMADO EN PANTALLA :::
        </div>
    </div>

    <script>
        const serverIP = window.location.hostname;
        const MAX_TURNOS = 5;
        let turnosMostrados = [];

        function actualizarReloj() {
            const ahora = new Date();
            let horas = ahora.getHours();
            let minutos = ahora.getMinutes();
            horas = horas % 12;
            horas = horas ? horas : 12; 
            minutos = minutos < 10 ? '0' + minutos : minutos;
            
            document.getElementById('reloj-hora').innerText = `${horas}:${minutos}`;
            const opcionesFecha = { day: 'numeric', month: 'long' };
            document.getElementById('reloj-fecha').innerText = ahora.toLocaleDateString('es-ES', opcionesFecha);
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        async function cargarHistorial() {
            try {
                const response = await fetch(`http://${serverIP}:8100/turnos/llamados`);
                if(response.ok) {
                    const turnos = await response.json();
                    turnos.reverse().forEach(turno => {
                        const turnoStr = `${turno.nomenclatura}${turno.numero_turno}`;
                        agregarTurnoAPantalla(turnoStr, "CAJA_1", false);
                    });
                }
            } catch (error) {
                console.error("Error cargando historial de turnos:", error);
            }
        }

        function conectarWebSocket() {
            const ws = new WebSocket(`ws://${serverIP}:8100/ws/pantalla`);
            
            ws.onmessage = function(event) {
                const mensaje = JSON.parse(event.data);
                if (mensaje.accion === "NUEVO_TURNO") {
                    const turnoStr = `${mensaje.datos.nomenclatura}${mensaje.datos.numero}`;
                    agregarTurnoAPantalla(turnoStr, "CAJA_1", true);
                }
            };

            ws.onclose = function(e) {
                setTimeout(conectarWebSocket, 3000);
            };
        }

        function agregarTurnoAPantalla(turno, modulo, esNuevo) {
            const contenedor = document.getElementById('contenedor-turnos');
            
            const itemsViejos = contenedor.getElementsByClassName('turno-item');
            for(let item of itemsViejos) {
                item.classList.remove('nuevo');
            }

            const div = document.createElement('div');
            div.className = 'turno-item';
            if(esNuevo) div.classList.add('nuevo');
            
            div.innerHTML = `
                <div class="turno-col">${turno}</div>
                <div class="mod-col">${modulo}</div>
            `;
            
            contenedor.insertBefore(div, contenedor.firstChild);
            turnosMostrados.unshift(div);

            if (turnosMostrados.length > MAX_TURNOS) {
                const ultimo = turnosMostrados.pop();
                contenedor.removeChild(ultimo);
            }

            if(esNuevo) {
                llamarPorVoz(turno, modulo);
            }
        }

        function llamarPorVoz(turno, modulo) {
            try {
                if ('speechSynthesis' in window) {
                    const turnoHablado = turno.replace(/([a-zA-Z])(\d)/g, '$1 $2');
                    const texto = `Turno ${turnoHablado}, dirigirse a ${modulo.replace('_', ' ')}`;
                    
                    const utterance = new SpeechSynthesisUtterance(texto);
                    utterance.lang = 'es-ES';
                    utterance.rate = 0.85; 
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {}
        }

        cargarHistorial();
        conectarWebSocket();
    </script>
</body>
</html>
